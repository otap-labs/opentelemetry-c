[package]
name = "opentelemetry-c-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.13"
opentelemetry-c-abi = { path = "../abi" }
opentelemetry-c-api = { path = "../api" }
opentelemetry-c-sdk = { path = "../sdk", default-features = false }

[[bin]]
name = "metrics_inputs"
path = "fuzz_targets/metrics_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logs_records"
path = "fuzz_targets/logs_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handle_kinds"
path = "fuzz_targets/handle_kinds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_exporter_callbacks"
path = "fuzz_targets/log_exporter_callbacks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exporter_visitor"
path = "fuzz_targets/exporter_visitor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trace_propagation"
path = "fuzz_targets/trace_propagation.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "span_start_ex"
path = "fuzz_targets/span_start_ex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sampler_config"
path = "fuzz_targets/sampler_config.rs"
test = false
doc = false
bench = false
