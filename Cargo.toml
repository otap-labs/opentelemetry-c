[workspace]
members = [
    "abi",
    "api",
    "sdk",
]
exclude = ["fuzz"]

resolver = "2"

[profile.bench]
# https://doc.rust-lang.org/cargo/reference/profiles.html#bench
# See function names in profiling reports.
# 2/true is too much, 0 is not enough, 1 is just right for back traces
debug = 1

[workspace.dependencies]
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false }
opentelemetry_sdk = { version = "0.32", default-features = false }
criterion = "0.8"

[workspace.lints.rust]
rust_2024_compatibility = { level = "warn", priority = -1 }
# No need to enable those, because it is either unnecessary or results in ugly syntax
if_let_rescope = "allow"
tail_expr_drop_order = "allow"
# Keep `$x:expr` macro fragment specifiers instead of the edition-2024 `expr_2021` form.
# `expr_2021` was only stabilized in Rust 1.83, so using it would break the 1.77 product MSRV;
# in edition 2021 `expr` is exactly equivalent. See VERSIONING.md (Rust toolchain policy).
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = 1 }
