[package]
name = "opentelemetry-c-sdk"
description = "Rust-backed C SDK for OpenTelemetry traces and Metrics that installs into the C API's global providers"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
homepage = "https://github.com/otap-labs/opentelemetry-c/tree/main/sdk"
repository = "https://github.com/otap-labs/opentelemetry-c/tree/main/sdk"
keywords = ["opentelemetry", "tracing", "ffi", "c", "otlp"]
categories = ["development-tools::debugging", "api-bindings"]
license = "Apache-2.0"
publish = false

# The SDK library. C consumers link this PLUS `libopentelemetry_c_api`; the SDK cdylib
# references API registration symbols resolved from the process-global symbol scope at load
# time (see build.rs).
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
opentelemetry-c-abi = { path = "../abi" }
# Deliberately do not add `opentelemetry-c-api` here. The SDK calls the API through
# external C symbols; a Rust path dependency could embed another API instance and duplicate
# the process-global provider slots.
opentelemetry = { workspace = true, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { workspace = true, features = [
    "trace",
    "metrics",
    "logs",
    "spec_unstable_metrics_views",
    "experimental_metrics_custom_reader",
    "experimental_metrics_bound_instruments",
] }
futures-executor = "0.3"
# OTLP transports are optional exporter implementations, not SDK core. HTTP/protobuf is
# enabled by default; gRPC/tonic is independently selectable.
opentelemetry-otlp = { workspace = true, optional = true }
# Optional direct dependency used only to select the OTLP blocking HTTP client's TLS backend
# via this crate's `native-tls` / `rustls-tls` features. Pulled in only with the `otlp`
# HTTP feature; the exporter is driven through opentelemetry-otlp — this crate never calls reqwest.
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "blocking",
] }
tokio = { version = "1", optional = true, default-features = false, features = [
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
# OpenTelemetry 0.32 declares tonic 0.14.1. Pin that MSRV-compatible release instead of
# accepting newer 0.14.x releases that require Rust 1.88.
tonic = { version = "=0.14.1", optional = true, default-features = false }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics", "logs", "testing", "spec_unstable_metrics_views"] }
# The SDK-backed hot-path benchmark drives the real C API entrypoints (global provider
# slot, span/tracer ops). Linking the API rlib here also resolves this crate's `api_ffi`
# extern `otel_api_*` imports for the bench binary. Benchmark/test only — never a runtime dep.
opentelemetry-c-api = { path = "../api" }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic", "metrics", "logs"] }
prost = "=0.14.4"
criterion = { workspace = true }
tokio = { version = "1", default-features = false, features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "=0.14.1", default-features = true }

[[bench]]
name = "sdk_hotpath"
harness = false
# Builds a real HTTP OTLP exporter, so it requires the `otlp-http` feature. This
# keeps `cargo bench --no-default-features` from trying to compile a bench that cannot work.
required-features = ["otlp-http"]

[[bench]]
name = "metrics_allocations"
harness = false

[[bench]]
name = "logs_hotpath"
harness = false
# Builds a real HTTP OTLP Logs exporter, so it requires the `otlp-http` feature.
required-features = ["otlp-http"]

[[bench]]
name = "logs_allocations"
harness = false
required-features = ["otlp-http"]

# The custom exporter needs no transport feature, so this bench builds in every configuration.
[[bench]]
name = "logs_export_conversion"
harness = false

[features]
# Default preserves today's experience: the OTLP HTTP/protobuf exporter with OS/platform TLS.
default = ["native-tls"]
# Compatibility alias preserving the existing OTLP HTTP/protobuf behavior.
otlp = ["otlp-http"]
# Blocking HTTP/protobuf transport for Traces, Metrics, and Logs.
otlp-http = [
    "dep:opentelemetry-otlp",
    "dep:reqwest",
    "opentelemetry-otlp/trace",
    "opentelemetry-otlp/metrics",
    "opentelemetry-otlp/logs",
    "opentelemetry-otlp/http-proto",
    "opentelemetry-otlp/reqwest-blocking-client",
]
# gRPC/tonic transport for Metrics and Logs. The C SDK owns the Tokio runtime used by this
# transport.
otlp-grpc = [
    "dep:opentelemetry-otlp",
    "dep:tokio",
    "dep:tonic",
    "opentelemetry-otlp/metrics",
    "opentelemetry-otlp/logs",
    "opentelemetry-otlp/grpc-tonic",
]
# TLS backends are transport-specific.
native-tls = ["otlp-http", "reqwest/native-tls"]
rustls-tls = ["otlp-http", "reqwest/rustls"]
grpc-tls-ring = [
    "otlp-grpc",
    "opentelemetry-otlp/tls-ring",
    "opentelemetry-otlp/tls-roots",
]
# Compression support remains transport-specific even though the C selector is neutral.
otlp-http-gzip = ["otlp-http", "opentelemetry-otlp/gzip-http"]
otlp-http-zstd = ["otlp-http", "opentelemetry-otlp/zstd-http"]
otlp-grpc-gzip = ["otlp-grpc", "opentelemetry-otlp/gzip-tonic"]
otlp-grpc-zstd = ["otlp-grpc", "opentelemetry-otlp/zstd-tonic"]
# SDK-owned Tokio runtime driving the pinned experimental async periodic Metrics reader.
metrics-async-runtime = [
    "dep:tokio",
    "opentelemetry_sdk/experimental_metrics_periodicreader_with_async_runtime",
]

[lints]
workspace = true
