# SPDX-License-Identifier: Apache-2.0

name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    # Weekly rather than nightly until runtime and repository demand justify more CI usage.
    - cron: "23 7 * * 0"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: clusterfuzzlite-batch
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Build AddressSanitizer fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run batch fuzzing
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@82652fb49e77bc29c35da1167bb286e93c6bcc05 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
          output-sarif: true
          parallel-fuzzing: true
          report-unreproducible-crashes: false
