# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check coordinated release metadata
        run: scripts/check-release-metadata.sh

  msrv:
    # OPENTELEMETRY_C_VALIDATED_MSRV is the single source of truth for the product MSRV.
    # Maintainers set it only after validating the locked product graph on that exact
    # toolchain and setting the rust-version in all three manifests to the same value.
    # Until it is set this job FAILS CLOSED on every event (push, pull_request, merge_group,
    # tag) so a green pipeline never implies the MSRV is enforced. See VERSIONING.md and #3.
    #
    # Runs on both supported shared-library platforms (Linux and macOS) so target-specific
    # production dependencies (e.g. openssl on Linux, security-framework on macOS for the
    # default native-TLS build) are proven to build with the exact validated toolchain.
    env:
      VALIDATED_MSRV: ${{ vars.OPENTELEMETRY_C_VALIDATED_MSRV }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a validated MSRV
        if: env.VALIDATED_MSRV == ''
        run: |
          echo "::error title=MSRV unresolved::OPENTELEMETRY_C_VALIDATED_MSRV is not set, so the" \
            "product MSRV is not enforced and the source release is blocked (see issue #3 and" \
            "VERSIONING.md). A maintainer must validate the committed --locked product graph on" \
            "the chosen toolchain, set the rust-version in abi/, api/, and sdk/ Cargo.toml to that" \
            "value, and set the OPENTELEMETRY_C_VALIDATED_MSRV repository variable to the same" \
            "version. This check is not skipped when the variable is absent."
          exit 1
      - name: Check validated MSRV metadata
        # Fails if the validated value drifts from the manifest rust-version fields, if the
        # manifests disagree, or if Cargo.lock is inconsistent.
        run: scripts/check-release-metadata.sh
      - name: Install the exact validated MSRV toolchain
        # Pinned because this job gates the source release; installs the exact validated
        # toolchain with the default minimal profile instead of latest stable.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.VALIDATED_MSRV }}
      - name: Check product libraries at the validated MSRV
        # Library-only (no --all-targets) so test/benchmark/fuzz-only dependencies never
        # define the product MSRV. Covers every documented production feature configuration:
        # the default OTLP HTTP/native-TLS build, the transport-free core, OTLP gRPC, the
        # combined OTLP HTTP+gRPC build over Rustls (native-TLS off), and the all-features
        # superset that enables every transport and both HTTP TLS backends together.
        run: |
          cargo check --locked -p opentelemetry-c-abi --lib
          cargo check --locked -p opentelemetry-c-api --lib
          cargo check --locked -p opentelemetry-c-sdk --lib
          cargo check --locked -p opentelemetry-c-sdk --lib --no-default-features
          cargo check --locked -p opentelemetry-c-sdk --lib --no-default-features --features otlp-grpc
          cargo check --locked -p opentelemetry-c-sdk --lib --no-default-features \
            --features otlp-http,rustls-tls,otlp-grpc,grpc-tls-ring,otlp-http-gzip,otlp-http-zstd,otlp-grpc-gzip,otlp-grpc-zstd
          cargo check --locked -p opentelemetry-c-sdk --lib --all-features

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit locked dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Compile fuzz targets
        run: cargo +nightly fuzz build

  linux-shared-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify debug and release shared libraries
        run: scripts/verify-shared-libraries.sh

  allocation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Enforce API and SDK allocation contracts
        run: |
          cargo bench --locked -p opentelemetry-c-api --bench api_allocations
          cargo bench --locked -p opentelemetry-c-sdk --bench metrics_allocations
          cargo bench --locked -p opentelemetry-c-sdk --bench logs_allocations

  macos-shared-libraries:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build and verify exports, dependency, and local-scope loading
        run: scripts/verify-macos-shared-libraries.sh
      - name: Test split artifacts
        env:
          CI: "1"
        run: |
          cargo test --locked -p opentelemetry-c-sdk --test c_header_compile --all-features
          cargo test --locked -p opentelemetry-c-sdk --test cross_artifact --all-features
          cargo test --locked -p opentelemetry-c-sdk \
            --test custom_metric_exporter_cross_artifact --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check license identifiers
        run: scripts/check-license-headers.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: |
          cargo build -p opentelemetry-c-api
          cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test SDK core (no default features)
        run: cargo test -p opentelemetry-c-sdk --no-default-features
      - name: Test Metrics transport feature matrix
        run: |
          cargo test -p opentelemetry-c-sdk --lib --no-default-features --features otlp-http
          cargo test -p opentelemetry-c-sdk --lib --no-default-features --features otlp-grpc
          cargo test -p opentelemetry-c-sdk --lib --no-default-features --features otlp-http,otlp-grpc
      - name: Test all-feature SDK unit coverage
        run: cargo test -p opentelemetry-c-sdk --lib --all-features
      - name: Test split artifacts with OTLP gRPC Metrics
        run: |
          cargo build -p opentelemetry-c-api
          cargo build -p opentelemetry-c-sdk --all-features
          cargo test -p opentelemetry-c-sdk --test cross_artifact --all-features
