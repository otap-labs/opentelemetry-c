name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check coordinated release metadata
        run: scripts/check-release-metadata.sh

  msrv:
    # The declared 1.75 MSRV is a known release blocker with the current lockfile. Keep this
    # visible but non-blocking until maintainers choose and validate the product MSRV.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@1.75.0
      - name: Check locked workspace at declared MSRV
        run: cargo check --locked --workspace --all-targets

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit locked dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test SDK core (no default features)
        run: cargo test -p opentelemetry-c-sdk --no-default-features
      - name: Test Metrics transport feature matrix
        run: |
          cargo test -p opentelemetry-c-sdk --lib --no-default-features --features otlp-http
          cargo test -p opentelemetry-c-sdk --lib --no-default-features --features otlp-grpc
          cargo test -p opentelemetry-c-sdk --lib --no-default-features --features otlp-http,otlp-grpc
      - name: Test split artifacts with OTLP gRPC Metrics
        run: |
          cargo build -p opentelemetry-c-api -p opentelemetry-c-sdk --all-features
          cargo test -p opentelemetry-c-sdk --test cross_artifact --all-features
